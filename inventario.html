<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <title>Inventario | BioGymStore</title>
  <link rel="icon" type="image/png" href="img/favicon.png">
  <link href="vendor/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="inventario">

  <!-- NAVBAR -->
  <nav id="mainNav" class="navbar navbar-expand-lg sticky-top">
    <div class="container">
      <a class="navbar-brand" href="dashboard.html">
        <img src="img/logo.png" alt="BioGym Store" class="brand-logo-img">
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu" aria-label="Abrir menú">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav me-auto gap-lg-2">
          <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link" href="inventario.html">Inventario</a></li>
          <li class="nav-item"><a class="nav-link" href="ingreso-stock.html">Ingresar Stock</a></li>
          <li class="nav-item"><a class="nav-link" href="traslado.html">Traslado</a></li>
          <li class="nav-item"><a class="nav-link" href="proveedores.html">Proveedores</a></li>
        </ul>
        <div class="user-badge">
          <span class="avatar js-user-initials">--</span>
          <div class="user-info d-none d-sm-flex">
            <span class="user-name js-user-name">--</span>
            <span class="user-role js-user-role">--</span>
          </div>
          <button id="btnLogout" class="btn-logout">Cerrar sesión</button>
        </div>
      </div>
    </div>
  </nav>

  <main class="container py-4">

    <section class="d-flex flex-wrap justify-content-between align-items-end gap-3 mb-4">
      <div>
        <p class="text-secondary mb-1">Consulta del stock por ubicación</p>
        <h1 class="h3 fw-bold mb-0">Inventario</h1>
      </div>
      <a href="ingreso-stock.html" class="btn btn-accent">+ Nuevo producto</a>
    </section>

    <section class="card p-3 p-md-4">
      <!-- Barra de herramientas: búsqueda + filtro de categoría -->
      <div class="row g-3 mb-3">
        <div class="col-md-8">
          <label for="searchInput" class="form-label">Buscar producto</label>
          <input type="text" id="searchInput" class="form-control" placeholder="Buscar por SKU, nombre o categoría...">
        </div>
        <div class="col-md-4">
          <label for="categoryFilter" class="form-label">Categoría</label>
          <select id="categoryFilter" class="form-select">
            <option value="">Todas las categorías</option>
          </select>
        </div>
      </div>

      <p class="text-secondary small mb-2" id="resultCount"></p>

      <!-- Tabla de inventario (columnas de bodega dinámicas) -->
      <div class="table-responsive">
        <table class="table mb-0">
          <thead id="inventoryHead"></thead>
          <tbody id="inventoryBody"></tbody>
        </table>
      </div>
      <div id="emptyState" class="text-center text-secondary py-4 d-none">
        No se encontraron productos con ese criterio.
      </div>
    </section>

    <footer class="app-footer text-center mt-4">
      BioGymStore — Sistema interno de gestión de stock · Uso exclusivo del personal autorizado
    </footer>
  </main>

  <script src="vendor/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/app.js"></script>
  <script src="js/pages/inventario.js"></script>
</body>
</html>
